# ============================================================================
# AdvNFC Protected Scripts
#
# These governed scripts are loaded from the AdvNFC package. They must not be
# recreated in the Home Assistant Script UI, which would create a separate
# mutable copy outside this source authority.
# ============================================================================

script:
  advnfc_find_tag_record:
    alias: 'AdvNFC - Fn: Find Tag Record'
    description: Returns the normalized active tag-mapping record matching a scanned UID
    mode: parallel
    max: 10
    fields:
      uid:
        name: UID
        description: Scanned NFC UID
        required: true
        selector:
          text:
    sequence:
    - action: advnfc.find_tag_record
      data:
        uid: '{{ uid }}'
      response_variable: tag_record_response
    - stop: Tag lookup complete
      response_variable: tag_record_response

  advnfc_select_tag_action:
    alias: AdvNFC - Select Tag Action
    description: Routes a validated typed AdvNFC tag action
    mode: parallel
    max: 10
    fields:
      tag_record:
        name: Tag Record
        description: Normalized validated AdvNFC tag record
        required: true
        selector:
          object:
      trigger_entity:
        name: Trigger Entity
        description: Originating Home Assistant reader entity
        selector:
          entity:
    sequence:
    - variables:
        action_type: '{{ tag_record.action.type | default('''', true) | string | trim }}'
    - alias: Choose Tag Action based on action_type
      choose:
      - alias: ASTV Intent
        conditions:
        - condition: template
          value_template: '{{ action_type == ''astv_intent'' }}'
        sequence:
        - action: script.astv_intent_gateway
          data:
            intent_id: '{{ tag_record.action.intent_id }}'
            input_area_override: >-
              {{ tag_record.area_override | default('', true) }}
            trigger_entity: '{{ trigger_entity }}'
      default:
      - action: notify.persistent_notification
        data:
          title: Unsupported Tag Action
          message: >-
            Tag record for UID '{{ tag_record.uid | default('(unknown)', true) }}'
            has unsupported action type '{{ action_type }}'.
      - stop: Unsupported tag action
        error: true

  advnfc_uid_gateway:
    alias: AdvNFC - UID Gateway
    description: ''
    fields:
      uid:
        selector:
          text:
        name: UID
        required: true
        description: Received UID
      trigger_entity:
        selector:
          entity:
        default: sensor.pi_nfc_99_last_uid
        name: Trigger Entity
    sequence:
    - action: script.advnfc_find_tag_record
      data:
        uid: '{{ uid }}'
      response_variable: tag_record_response
    - if:
      - condition: template
        value_template: '{{ tag_record_response | default({}, true) | count == 0 }}'
      then:
      - action: notify.persistent_notification
        data:
          title: No Tag Record Found
          message: 'No tag record found for UID:

            {{ uid }}'
      - stop: No tag record found
        error: false
    - variables:
        tag_intent_id: '{{ tag_record_response.action.intent_id | string | trim | lower }}'
        tag_area_override: >-
          {{ tag_record_response.area_override | default('', true) | string | trim }}
    - action: notify.persistent_notification
      data:
        title: Tag Record Found
        message: 'UID: {{ uid }}

          Trigger Entity: {{ trigger_entity }}

          Intent ID: {{ tag_intent_id }}

          Area Override: {{ tag_area_override if tag_area_override != '''' else ''(none)''
          }}'
    - action: script.advnfc_select_tag_action
      data:
        tag_record: '{{ tag_record_response }}'
        trigger_entity: '{{ trigger_entity }}'
    mode: parallel
    max: 10
