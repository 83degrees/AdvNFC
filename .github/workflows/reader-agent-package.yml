name: Reader Agent Package

on:
  pull_request:
    paths:
      - "04_Source/reader_agent/**"
      - "05_Tests/test_advnfc_packaging.py"
      - ".github/workflows/reader-agent-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.1.0"
        required: true
        type: string
  push:
    tags:
      - "reader-agent-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/reader-agent-v* ]]; then
            VERSION="${GITHUB_REF_NAME#reader-agent-v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0~ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install pytest pyyaml

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n 04_Source/reader_agent/advnfc_reader_agent.sh
          bash -n 04_Source/reader_agent/packaging/build_deb.sh
          bash -n 04_Source/reader_agent/packaging/advnfc-reader-agent-check
          bash -n 04_Source/reader_agent/packaging/advnfc-reader-agent-init
          python -m py_compile 04_Source/reader_agent/packaging/advnfc-profile

      - name: Run reader packaging tests
        run: python -m pytest -q 05_Tests/test_advnfc_packaging.py 05_Tests/test_advnfc_reader_agent.py 05_Tests/test_advnfc_profiles.py

      - name: Build Debian package
        shell: bash
        run: |
          bash 04_Source/reader_agent/packaging/build_deb.sh "${{ steps.version.outputs.version }}"

      - name: Inspect Debian package
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: advnfc-reader-agent-${{ steps.version.outputs.version }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/reader-agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          pattern: advnfc-reader-agent-*
          merge-multiple: true
          path: dist

      - name: Attach tagged package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
