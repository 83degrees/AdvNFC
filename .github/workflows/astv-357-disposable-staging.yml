name: ASTV-357 disposable staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        required: true
        default: read_only
        type: choice
        options:
          - read_only
          - controlled_lifecycle

permissions:
  contents: read

jobs:
  verify-isolated-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADVNFC_TAG: v1.6.0-beta.dbef2f5
      ADVNFC_SHA: dbef2f5133d2efb6f426b348916dc0c58ec1e147
      HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.4
      STAGE_CONTAINER: astv357-disposable-stage

    steps:
      - name: Check out governed candidate and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble private staging configuration
        shell: bash
        run: |
          set -euo pipefail
          stage_root="${RUNNER_TEMP}/astv-357-stage"
          config_root="${stage_root}/config"
          mkdir -p "${config_root}/custom_components"
          cp -R 06_Validation/Staging/ASTV-357/config/. "${config_root}/"

          resolved_sha="$(git rev-list -n 1 "${ADVNFC_TAG}")"
          test "${resolved_sha}" = "${ADVNFC_SHA}"
          git archive "${ADVNFC_TAG}" custom_components/advnfc | tar -x -C "${config_root}"

          printf '%s\n' "${resolved_sha}" > "${stage_root}/advnfc-tag-sha.txt"
          git rev-parse "${ADVNFC_TAG}:custom_components/advnfc" > "${stage_root}/advnfc-tree.txt"
          find "${config_root}" -type f -print0 | sort -z | xargs -0 sha256sum > "${stage_root}/config-sha256.txt"
          printf '%s\n' "${stage_root}" > "${RUNNER_TEMP}/astv357-stage-root.txt"

      - name: Inspect image identity and correct private config ownership
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt")"
          config_root="${stage_root}/config"

          docker pull "${HA_IMAGE}"
          docker image inspect "${HA_IMAGE}" --format '{{json .RepoDigests}}' > "${stage_root}/ha-image-repodigests.json"
          docker image inspect "${HA_IMAGE}" --format '{{json .Config.User}}' > "${stage_root}/ha-image-config-user.json"

          ha_uid="$(docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 "${HA_IMAGE}" -c 'import os; print(os.getuid())')"
          ha_gid="$(docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 "${HA_IMAGE}" -c 'import os; print(os.getgid())')"
          test "${ha_uid}" -ge 0
          test "${ha_gid}" -ge 0
          printf '%s\n' "${ha_uid}" > "${stage_root}/ha-process-uid.txt"
          printf '%s\n' "${ha_gid}" > "${stage_root}/ha-process-gid.txt"

          stat --format '{"uid":%u,"gid":%g,"mode":"%a","path":"%n"}' "${config_root}" > "${stage_root}/config-permissions-before.json"
          sudo chown -R "${ha_uid}:${ha_gid}" "${config_root}"
          sudo chmod -R u+rwX,go-rwx "${config_root}"
          stat --format '{"uid":%u,"gid":%g,"mode":"%a","path":"%n"}' "${config_root}" > "${stage_root}/config-permissions-after.json"
          test "$(stat --format '%u' "${config_root}")" = "${ha_uid}"
          test "$(stat --format '%g' "${config_root}")" = "${ha_gid}"
          test "$(stat --format '%a' "${config_root}")" = "700"

      - name: Start network-isolated Home Assistant stage
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt")"
          docker run --detach \
            --name "${STAGE_CONTAINER}" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --tmpfs /run:rw,nosuid,size=64m \
            --volume "${stage_root}/config:/config:rw" \
            --entrypoint python3 \
            "${HA_IMAGE}" \
            -m homeassistant --config /config

          for attempt in $(seq 1 120); do
            if docker exec "${STAGE_CONTAINER}" python -c "import socket; connection=socket.create_connection(('127.0.0.1', 8123), 2); connection.close()" 2>/dev/null; then
              sleep 2
              break
            fi
            if ! docker inspect "${STAGE_CONTAINER}" --format '{{.State.Running}}' | grep -qx true; then
              docker logs "${STAGE_CONTAINER}"
              exit 1
            fi
            sleep 2
          done

          docker inspect "${STAGE_CONTAINER}" \
            --format '{"id":"{{.Id}}","image":"{{.Image}}","network_mode":"{{.HostConfig.NetworkMode}}","published_ports":{{json .HostConfig.PortBindings}},"cap_drop":{{json .HostConfig.CapDrop}},"security_opt":{{json .HostConfig.SecurityOpt}}}' \
            > "${stage_root}/container-isolation.json"

          docker exec "${STAGE_CONTAINER}" python3 -c \
            'from pathlib import Path; p=Path("/config/ASTV-357/private-config-write-proof"); p.parent.mkdir(parents=True, exist_ok=True); p.write_text("private-stage-write-ok\n", encoding="utf-8")'
          docker exec "${STAGE_CONTAINER}" python3 -c \
            'import json, os; from pathlib import Path; p=Path("/config/ASTV-357/private-config-write-proof"); s=p.stat(); print(json.dumps({"content": p.read_text(encoding="utf-8").strip(), "uid": s.st_uid, "gid": s.st_gid, "mode": oct(s.st_mode & 0o777), "path": str(p)}))' \
            > "${stage_root}/config-write-proof.json"

      - name: Verify identity, baseline, doubles, and stop boundary
        if: inputs.mode != 'controlled_lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt")"
          docker exec "${STAGE_CONTAINER}" python /config/staging/verify_stage.py
          sudo cp "${stage_root}/config/staging/stage-evidence.json" "${stage_root}/stage-evidence.json"
          sudo chown "$(id -u):$(id -g)" "${stage_root}/stage-evidence.json"

      - name: Execute authorized controlled lifecycle
        if: inputs.mode == 'controlled_lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt")"
          docker exec \
            --env GITHUB_ACTOR="${GITHUB_ACTOR}" \
            --env GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --env GITHUB_SHA="${GITHUB_SHA}" \
            "${STAGE_CONTAINER}" \
            python /config/staging/execute_lifecycle.py
          sudo cp "${stage_root}/config/staging/stage-evidence.json" "${stage_root}/stage-evidence.json"
          sudo cp "${stage_root}/config/staging/lifecycle-evidence.json" "${stage_root}/lifecycle-evidence.json"
          sudo chown "$(id -u):$(id -g)" "${stage_root}/stage-evidence.json" "${stage_root}/lifecycle-evidence.json"

      - name: Verify segregation and final restoration
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt")"

          sudo test ! -e "${stage_root}/config/ASTV-357/gateway-spy.jsonl"
          ! sudo grep -R -E -i \
            '(ha-starburst|assistive/nfc|advnfc/[A-Za-z0-9_-]+/last_uid|mqtt:|password:|token:|api_key:)' \
            "${stage_root}/config" \
            --exclude='stage-evidence.json'

          before="$(grep 'AdvNFC/advnfc_tag_mapping.yaml$' "${stage_root}/config-sha256.txt" | cut -d' ' -f1)"
          after="$(sudo sha256sum "${stage_root}/config/AdvNFC/advnfc_tag_mapping.yaml" | cut -d' ' -f1)"
          if test "${{ inputs.mode }}" = 'controlled_lifecycle'; then
            jq -e \
              '.outcome == "pass" and .baseline_restoration.logical_exact == true and .gateway_sink.invocations == 0' \
              "${stage_root}/lifecycle-evidence.json" >/dev/null
          else
            test "${before}" = "${after}"
          fi

      - name: Capture logs and dispose stage
        if: always()
        shell: bash
        run: |
          stage_root="$(cat "${RUNNER_TEMP}/astv357-stage-root.txt" 2>/dev/null || true)"
          if test -n "${stage_root}" && test -d "${stage_root}"; then
            docker logs "${STAGE_CONTAINER}" > "${stage_root}/home-assistant.log" 2>&1 || true
            for evidence_name in stage-evidence.json lifecycle-evidence.json; do
              if sudo test -f "${stage_root}/config/staging/${evidence_name}"; then
                sudo cp "${stage_root}/config/staging/${evidence_name}" "${stage_root}/${evidence_name}"
                sudo chown "$(id -u):$(id -g)" "${stage_root}/${evidence_name}"
              fi
            done
          fi
          docker rm --force "${STAGE_CONTAINER}" >/dev/null 2>&1 || true
          if docker ps --all --format '{{.Names}}' | grep -qx "${STAGE_CONTAINER}"; then
            echo "Disposable stage still exists after removal" >&2
            exit 1
          fi
          if test -n "${stage_root}" && test -d "${stage_root}"; then
            printf '%s\n' 'container_removed=true' > "${stage_root}/disposal.txt"
          fi

      - name: Upload immutable staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astv-357-disposable-staging-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/astv-357-stage/advnfc-tag-sha.txt
            ${{ runner.temp }}/astv-357-stage/advnfc-tree.txt
            ${{ runner.temp }}/astv-357-stage/config-sha256.txt
            ${{ runner.temp }}/astv-357-stage/config-permissions-before.json
            ${{ runner.temp }}/astv-357-stage/config-permissions-after.json
            ${{ runner.temp }}/astv-357-stage/config-write-proof.json
            ${{ runner.temp }}/astv-357-stage/container-isolation.json
            ${{ runner.temp }}/astv-357-stage/disposal.txt
            ${{ runner.temp }}/astv-357-stage/ha-image-config-user.json
            ${{ runner.temp }}/astv-357-stage/ha-image-repodigests.json
            ${{ runner.temp }}/astv-357-stage/ha-process-uid.txt
            ${{ runner.temp }}/astv-357-stage/ha-process-gid.txt
            ${{ runner.temp }}/astv-357-stage/home-assistant.log
            ${{ runner.temp }}/astv-357-stage/lifecycle-evidence.json
            ${{ runner.temp }}/astv-357-stage/stage-evidence.json
          if-no-files-found: error
          retention-days: 30

