name: AdvNFC pytest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run maintained regression suite
        run: python -m pytest -q

      - name: Check administration frontend syntax
        run: node --check custom_components/advnfc/frontend/advnfc-administration-panel.mjs

      - name: Run administration frontend suite
        run: node --test 05_Tests/test_advnfc_admin_frontend.mjs
